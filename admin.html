<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>BIDELAN · Administración</title>

    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/admin.css">
</head>

<body>

    <div id="contenedorAdmin">

        <section id="cabeceraAuth">
            <img class="logo-icono" src="img/bidelan.png" alt="BIDELAN">
            <div>
                <h1>BIDELAN</h1>
                <p>Panel de administración</p>
            </div>
        </section>

        <div class="tarjeta-auth tarjeta-admin">

            <div class="cabecera-admin">
                <h2>Altas pendientes de aprobación</h2>
                <button type="button" class="btn-auth btn-recargar" id="btnRecargarPendientes">Actualizar</button>
            </div>

            <p class="mensaje-auth" id="mensajeAdmin"></p>

            <table class="tabla-pendientes" id="tablaPendientes" hidden>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo electrónico</th>
                        <th>Solicitado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaPendientes"></tbody>
            </table>

            <p class="texto-sin-pendientes" id="textoSinPendientes" hidden>No hay altas pendientes.</p>

        </div>

        <div class="tarjeta-auth tarjeta-admin">

            <div class="cabecera-admin">
                <h2>Usuarios y roles</h2>
                <button type="button" class="btn-auth btn-recargar" id="btnRecargarUsuarios">Actualizar</button>
            </div>

            <p class="mensaje-auth" id="mensajeUsuarios"></p>

            <table class="tabla-pendientes" id="tablaUsuarios" hidden>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo electrónico</th>
                        <th>Rol</th>
                    </tr>
                </thead>
                <tbody id="cuerpoTablaUsuarios"></tbody>
            </table>

            <p class="texto-sin-pendientes" id="textoSinUsuarios" hidden>No hay usuarios aprobados todavía.</p>

        </div>

    </div>

    <script src="js/config.js"></script>
    <script src="js/admin.js"></script>

</body>

</html>
