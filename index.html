<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Curso API-IDEE</title>

    <link rel="stylesheet" href="https://componentes.idee.es/api-idee/assets/css/apiidee.ol.min.css">
    <link rel="stylesheet" href="css/estilos.css?v=3.22">
</head>

<body>

    <div id="app">

 <aside id="sidebar">

    <!-- CABECERA -->
    <section id="logo">
        <img class="logo-icono" src="img/bidelan.png" alt="BIDELAN">

        <div>
            <h1>BIDELAN</h1>
            <p>Seguimiento de Actividades</p>
        </div>
    </section>

    <!-- BUSCADOR -->
    <section class="bloque bloque-buscador">
        <h2>🔍 Buscar tramo / PK</h2>

        <div class="contenedor-buscador">

    <input
        id="buscador"
        type="text"
        placeholder="Buscar por carretera o PK..."
        autocomplete="off"
    >

    <div id="sugerencias" class="sugerencias-buscador"></div>

</div>
    </section>

    <!-- ÁRBOL DE CAPAS -->
 <details class="bloque bloque-capas bloque-plegable">

    <summary>
        <h2><span class="flecha-bloque"></span>📂 ACTIVOS</h2>
    </summary>

    <div class="contenido-bloque">

    <!-- GEOMETRÍA -->
    <details class="grupo-capas" open>

        <summary>
            <span class="flecha-grupo"></span>
            📐 Geometría
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input
                    id="checkPKv0"
                    type="checkbox"
                    checked
                >
                <span class="simbolo-capa simbolo-punto"></span>
                PUNTOS KILOMÉTRICOS
            </label>

            <label class="fila-capa">
                <input
                    id="checkPartesAccidentes"
                    type="checkbox"
                    checked
                >
                <span class="simbolo-capa simbolo-punto"></span>
                PARTES DE ACCIDENTES
            </label>

            <label class="fila-capa">
                <input
                    id="checkEjes"
                    type="checkbox"
                    checked
                >
                <span class="simbolo-capa simbolo-linea"></span>
                EJES DE CARRETERA
            </label>

        </div>

    </details>

    <!-- EQUIPAMIENTO -->
    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            🛠️ Equipamiento
        </summary>

        <div class="contenido-grupo">
            <p class="texto-grupo-pendiente">Próximamente</p>
        </div>

    </details>

    <!-- EDIFICACIONES -->
    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            🏢 Edificaciones
        </summary>

        <div class="contenido-grupo">
            <p class="texto-grupo-pendiente">Próximamente</p>
        </div>

    </details>

    <!-- ESTRUCTURAS -->
    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            🌉 Estructuras
        </summary>

        <div class="contenido-grupo">

            <label class="fila-capa">
                <input
                    id="checkAusEstructuras"
                    type="checkbox"
                    checked
                >
                <span class="simbolo-capa simbolo-poligono"></span>
                AUSCULTACIÓN ESTRUCTURAS 2026
            </label>

        </div>

    </details>

    <!-- DRENAJE -->
    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            💧 Drenaje
        </summary>

        <div class="contenido-grupo">
            <p class="texto-grupo-pendiente">Próximamente</p>
        </div>

    </details>

    </div>

</details>

    <!-- CAMPAÑAS -->
    <details class="bloque bloque-campanas bloque-plegable">

    <summary>
        <h2><span class="flecha-bloque"></span>📅 CAMPAÑAS</h2>
    </summary>

    <div class="contenido-bloque">

    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            2026
        </summary>

        <div class="contenido-grupo">
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                BIDELAN
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                SERBITZU
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                IRAGAZ
            </label>
        </div>

    </details>

    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            2027
        </summary>

        <div class="contenido-grupo">
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                BIDELAN
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                SERBITZU
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                IRAGAZ
            </label>
        </div>

    </details>

    <details class="grupo-capas">

        <summary>
            <span class="flecha-grupo"></span>
            2028
        </summary>

        <div class="contenido-grupo">
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                BIDELAN
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                SERBITZU
            </label>
            <label class="fila-capa capa-pendiente">
                <input type="checkbox" disabled>
                IRAGAZ
            </label>
        </div>

    </details>

    </div>

</details>

    <!-- FILTRADO DE RESULTADOS -->
    <details class="bloque bloque-filtrado bloque-plegable">

    <summary>
        <h2><span class="flecha-bloque"></span>🎚️ FILTRADO RESULTADOS</h2>
    </summary>

    <div class="contenido-bloque">

    <div class="fila-filtro">
        <label for="filtroBloque">Bloque</label>
        <select id="filtroBloque" disabled>
            <option>Geometría</option>
            <option>Equipamiento</option>
            <option>Edificaciones</option>
            <option>Estructuras</option>
            <option>Drenaje</option>
        </select>
    </div>

    <div class="fila-filtro">
        <label for="filtroActivo">Activo</label>
        <select id="filtroActivo" disabled>
            <option>—</option>
        </select>
    </div>

    <div class="fila-filtro">
        <label for="filtroAtributo">Atributo</label>
        <select id="filtroAtributo" disabled>
            <option>—</option>
        </select>
    </div>

    <p class="texto-grupo-pendiente">Próximamente</p>

    </div>

</details>

    <!-- ANÁLISIS -->
    <details class="bloque bloque-analisis bloque-plegable">

    <summary>
        <h2><span class="flecha-bloque"></span>📊 ANÁLISIS</h2>
    </summary>

    <div class="contenido-bloque">

    <p class="texto-grupo-pendiente">Próximamente</p>

    </div>

</details>

</aside>

        <main id="main">
            <div id="mapa" class="m-container"></div>

            <!-- TABLA DE ATRIBUTOS: pestaña inferior con las capas consultables -->
            <div class="panel-tabla-atributos" id="panelTablaAtributos">

                <button type="button" class="pestana-abrir-tabla" id="btnAbrirTablaAtributos">
                    <span class="flecha-tabla">▲</span> Tabla de atributos
                </button>

                <div class="contenido-tabla-atributos" id="contenidoTablaAtributos" hidden>

                    <div class="cabecera-tabla-atributos">
                        <div class="pestanas-capas-tabla" id="pestanasCapasTabla"></div>
                        <div class="herramientas-tabla-atributos">
                            <button type="button" class="btn-herramienta-tabla" id="btnFiltrarExtensionTabla">
                                🔎 Filtrar por extensión de mapa
                            </button>
                            <button type="button" class="btn-herramienta-tabla" id="btnActualizarTabla">
                                ⟳ Actualizar
                            </button>
                            <button type="button" class="btn-cerrar-tabla" id="btnCerrarTablaAtributos" aria-label="Cerrar tabla">&times;</button>
                        </div>
                    </div>

                    <p class="aviso-tabla-atributos" id="avisoTablaAtributos"></p>

                    <div class="cuerpo-tabla-atributos">
                        <table id="tablaAtributosDatos">
                            <thead id="cabeceraColumnasTabla"></thead>
                            <tbody id="filasTablaAtributos"></tbody>
                        </table>
                    </div>

                </div>

            </div>
        </main>

    </div>

    <!-- VENTANA EMERGENTE: ficha del punto kilométrico -->
    <div class="overlay-ficha-pk" id="overlayFichaPK">
        <div class="popup-ficha-pk">

            <div class="cabecera-ficha-pk">
                <span id="tituloCabeceraFicha">Puntos Kilométricos</span>
                <button class="btn-cerrar-ficha-pk" id="btnCerrarFichaPK" type="button" aria-label="Cerrar">&times;</button>
            </div>

            <div id="contenidoFichaPK" class="cuerpo-ficha-pk"></div>

        </div>
    </div>

    <script src="https://componentes.idee.es/api-idee/vendor/browser-polyfill.js"></script>
    <script src="https://componentes.idee.es/api-idee/js/apiidee.ol.min.js"></script>
    <script src="https://componentes.idee.es/api-idee/js/configuration.js"></script>
    <script src="js/config.js?v=3.22"></script>
    <script src="js/sesion.js?v=3.22"></script>
    <script src="js/panel.js?v=3.22"></script>
    <script src="js/app.js?v=3.22"></script>
    <script src="js/tablaAtributos.js?v=3.22"></script>
    <script src="js/buscador.js?v=3.22"></script>
    <script src="js/capas.js?v=3.22"></script>
    <script src="js/adjuntos.js?v=3.22"></script>
    <script src="js/edicion.js?v=3.22"></script>

</body>

</html>
